name: Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：构建并发布已有标签；留空使用当前分支'
        required: false
        type: string

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: jessetzh/fooddiary
  CI_IMAGE: fooddiary-ci:local

# Pin runner OS releases, Action commits, and build helper image version tags.
# Action version comments identify the reviewed release; do not replace SHAs with tags.

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve build revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      release-tag: ${{ steps.revision.outputs.release-tag }}
      publish-pages: ${{ steps.revision.outputs.publish-pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve and validate revision
        id: revision
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          RELEASE_TAG="ci-$SHA"
          if [[ -n "$REQUESTED_TAG" ]]; then
            git check-ref-format "refs/tags/$REQUESTED_TAG"
            SHA="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
            RELEASE_TAG="$REQUESTED_TAG"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          PUBLISH_PAGES=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && -z "$REQUESTED_TAG" ]]; then
            PUBLISH_PAGES=true
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "publish-pages=$PUBLISH_PAGES" >> "$GITHUB_OUTPUT"

  backend-check:
    name: Go tests and vet
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...

  frontend-check:
    name: Flutter analyze and tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Own the cache here so the composite action cannot select a floating cache action.
      - name: Cache Flutter SDK and pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/flutter/stable-3.47.7-${{ runner.arch }}
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-3.47.7-${{ hashFiles('frontend/pubspec.lock') }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false
          cache-path: ${{ runner.tool_cache }}/flutter/stable-3.47.7-${{ runner.arch }}
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend
      - run: flutter test
        working-directory: frontend

  web-smoke:
    name: Production image and Web startup
    needs: [prepare, backend-check, frontend-check]
    # Playwright 1.58.2 supports Ubuntu 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2
      - name: Build and load production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.CI_IMAGE }}
          build-args: |
            BUILD_COMMIT=${{ needs.prepare.outputs.sha }}
            BUILD_RELEASE_TAG=${{ needs.prepare.outputs.release-tag }}
          cache-from: type=gha,scope=fooddiary-image
          cache-to: type=gha,scope=fooddiary-image,mode=max
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ci/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: scripts/ci/web
        run: npm ci
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('scripts/ci/web/package-lock.json') }}
      - name: Install Chromium and system dependencies
        working-directory: scripts/ci/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start from an empty data volume
        run: ./scripts/ci/verify-fresh-start.sh
      - name: Upload Web screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fooddiary-web-startup
          path: web-startup-artifacts/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Build and verify Android APK
    needs: [prepare, frontend-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Leave room for Gradle, the APK, and the emulator system image.
      - name: Free disk space for Android build and emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Own the cache here so the composite action cannot select a floating cache action.
      - name: Cache Flutter SDK and pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/flutter/stable-3.47.7-${{ runner.arch }}
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-3.47.7-${{ hashFiles('frontend/pubspec.lock') }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false
          cache-path: ${{ runner.tool_cache }}/flutter/stable-3.47.7-${{ runner.arch }}

      - name: Configure Android signing
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path
          keys = ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          values = [os.environ.get(key, '') for key in keys]
          if any(values) and not all(values):
              raise SystemExit('请完整配置四个 ANDROID 签名 Secrets，或全部留空使用开发签名。')
          mode = 'development'
          if all(values):
              keystore = Path(os.environ['RUNNER_TEMP']) / 'fooddiary-release.jks'
              # Secret 在网页上保存或复制时可能混入换行/空格，先剔除再解码
              encoded = ''.join(values[0].split())
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except (binascii.Error, ValueError) as error:
                  raise SystemExit(f'ANDROID_KEYSTORE_BASE64 不是有效的 base64（已尝试剔除空白字符）：{error}，请用 `base64 keystore.jks | tr -d "\\n"` 重新生成并更新 Secret。')
              if not decoded:
                  raise SystemExit('ANDROID_KEYSTORE_BASE64 解码结果为空，请检查 Secret 内容。')
              keystore.write_bytes(decoded)
              keystore.chmod(0o600)
              def escape(value):
                  return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
              props = {'storeFile': str(keystore), 'storePassword': values[1], 'keyAlias': values[2], 'keyPassword': values[3]}
              config = Path('frontend/android/key.properties')
              config.write_text(''.join(f'{key}={escape(value)}\n' for key, value in props.items()), encoding='utf-8')
              config.chmod(0o600)
              mode = 'release'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mode={mode}\n')
          PY

      - name: Build APK
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ARGS=(--release)
          if [[ -n "$API_BASE_URL" ]]; then
            [[ "$API_BASE_URL" == https://* ]] || { echo '发布包默认服务地址必须使用 HTTPS'; exit 1; }
            BUILD_ARGS+=(--dart-define="API_BASE_URL=$API_BASE_URL")
          fi
          bash ../scripts/build-flutter.sh apk "${BUILD_ARGS[@]}"

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Verify release APK startup
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/verify-android-startup.sh frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload startup screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fooddiary-android-startup
          path: android-startup-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare release files
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APK_NAME="fooddiary-$(git rev-parse --short=12 HEAD)-android.apk"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$APK_NAME"
          python3 scripts/ci/android-update-manifest.py "release-artifacts/$APK_NAME"
          cd release-artifacts
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          if [[ "$SIGNING_MODE" == release ]]; then
            printf '%s\n' 'Android APK 使用仓库配置的正式密钥签名。' > release-notes.md
          else
            printf '%s\n' 'Android APK 使用开发签名，适合安装预览。正式签名可通过仓库 ANDROID_* Secrets 配置。' > release-notes.md
          fi
          printf '\n%s\n' 'SHA-256 校验文件随 APK 一并提供。' >> release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fooddiary-release-android
          compression-level: 0
          retention-days: 14
          path: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/android-update.json
            release-artifacts/release-notes.md

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f frontend/android/key.properties "$RUNNER_TEMP/fooddiary-release.jks"

  mock-screenshots:
    name: Capture every mock page (mobile and desktop)
    needs: [prepare, frontend-check]
    # Keep browser installation on the same supported OS as web-smoke.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # Own the cache here so the composite action cannot select a floating cache action.
      - name: Cache Flutter SDK and pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.tool_cache }}/flutter/stable-3.47.7-${{ runner.arch }}
            ~/.pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-3.47.7-${{ hashFiles('frontend/pubspec.lock') }}
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false
          pub-cache: false
          cache-path: ${{ runner.tool_cache }}/flutter/stable-3.47.7-${{ runner.arch }}
      - name: Build isolated mock frontend
        # Web release assets use lossless WebP and HTTP Brotli compression.
        # Production Docker builds install the same requirements.
        run: |
          python3 -m pip install -r scripts/requirements-web.txt
          bash scripts/build-web.sh --dart-define=MOCK_API=true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ci/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: scripts/ci/web
        run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('scripts/ci/web/package-lock.json') }}
      - name: Install Chromium and system dependencies
        working-directory: scripts/ci/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Capture all pages using mock data
        run: bash scripts/ci/verify-mock-pages.sh
      - name: Upload gallery for GitHub Pages
        if: needs.prepare.outputs.publish-pages == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: mock-page-artifacts/site
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fooddiary-mock-pages
          path: mock-page-artifacts/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Android Release
    if: github.event_name != 'pull_request'
    needs: [prepare, web-smoke, android, mock-screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
    steps:
      - name: Download verified APK and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fooddiary-release-android
          path: release-artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          prerelease: ${{ startsWith(env.RELEASE_TAG, 'ci-') }}
          make_latest: ${{ startsWith(env.RELEASE_TAG, 'ci-') && 'false' || 'true' }}
          body_path: release-artifacts/release-notes.md
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
            release-artifacts/android-update.json

  deploy-gallery:
    name: Publish mock gallery to GitHub Pages
    needs: [prepare, web-smoke, android, mock-screenshots]
    if: needs.prepare.outputs.publish-pages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: fooddiary-mock-gallery-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy screenshot gallery
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Link gallery in workflow summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "### [浏览双端截图与界面功能说明]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and push Docker image
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) && !inputs.release_tag
    needs: [prepare, web-smoke, android, mock-screenshots, release]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v10.2.3-68

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ needs.prepare.outputs.sha }}
            BUILD_RELEASE_TAG=${{ needs.prepare.outputs.release-tag }}
          cache-from: type=gha,scope=fooddiary-image
          cache-to: type=gha,scope=fooddiary-image,mode=max

  deploy:
    name: Deploy to server
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request' && !inputs.release_tag
    needs: [prepare, build-and-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Run remote deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: ./scripts/ci/remote-deploy.sh
