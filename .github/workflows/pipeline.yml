name: Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: jessetzh/fooddiary
  CI_IMAGE: fooddiary-ci:local

permissions:
  contents: read

jobs:
  backend-check:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test ./...

  frontend-check:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze
        working-directory: frontend

  web-smoke:
    name: Production image and Web startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build and load production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha,scope=fooddiary-image
          cache-to: type=gha,scope=fooddiary-image,mode=max
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ci/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: scripts/ci/web
        run: npm ci
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('scripts/ci/web/package-lock.json') }}
      - name: Install Chromium and system dependencies
        working-directory: scripts/ci/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start from an empty data volume
        run: ./scripts/ci/verify-fresh-start.sh
      - name: Upload Web screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fooddiary-web-startup
          path: web-startup-artifacts/
          if-no-files-found: warn
          retention-days: 14

  android:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build APK
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --release --dart-define=API_BASE_URL="${API_BASE_URL:-https://fooddiary.example.com}"
      - uses: actions/upload-artifact@v7
        with:
          name: fooddiary-android
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          retention-days: 14

  android-startup:
    name: Verify APK startup on Android emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: fooddiary-android
          path: android-apk

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/verify-android-startup.sh android-apk/app-release.apk

      - name: Upload startup screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fooddiary-android-startup
          path: android-startup-artifacts/
          if-no-files-found: warn
          retention-days: 14

  mock-screenshots:
    name: Mock screenshots of all pages
    needs: android
    uses: ./.github/workflows/mock-screenshots.yml

  build-and-push:
    name: Build and push Docker image
    if: github.event_name != 'pull_request'
    needs:
      - backend-check
      - frontend-check
      - web-smoke
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fooddiary-image
          cache-to: type=gha,scope=fooddiary-image,mode=max

  deploy:
    name: Deploy to server
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run remote deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: ./scripts/ci/remote-deploy.sh
