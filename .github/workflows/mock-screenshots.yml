name: Mock page screenshots

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        default: ''
      publish-pages:
        description: 'Publish the gallery to GitHub Pages (default branch only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture every mock page (mobile and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build isolated mock frontend
        run: bash scripts/build-web.sh --dart-define=MOCK_API=true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ci/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: scripts/ci/web
        run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ hashFiles('scripts/ci/web/package-lock.json') }}
      - name: Install Chromium and system dependencies
        working-directory: scripts/ci/web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Capture all pages using mock data
        run: bash scripts/ci/verify-mock-pages.sh
      - name: Upload gallery for GitHub Pages
        if: inputs.publish-pages && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: mock-page-artifacts/site
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fooddiary-mock-pages
          path: mock-page-artifacts/
          if-no-files-found: warn
          retention-days: 14

  deploy-gallery:
    name: Publish mock gallery to GitHub Pages
    needs: screenshots
    if: inputs.publish-pages && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: fooddiary-mock-gallery-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy screenshot gallery
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link gallery in workflow summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "### [浏览双端截图与界面功能说明]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
