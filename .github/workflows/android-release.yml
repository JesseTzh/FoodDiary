name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有的发布标签，例如 v2.0.0'
        required: true
        type: string
      api_base_url:
        description: '默认后端 HTTPS 地址；留空使用仓库变量 API_BASE_URL'
        required: false
        type: string

concurrency:
  group: android-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.API_BASE_URL }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo '发布标签必须以 v 和版本数字开头'; exit 1; }
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$TAG_COMMIT" == "$(git rev-parse HEAD)" ]] || { echo '检出版本与发布标签不一致'; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Configure Android signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          keys = ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          values = [os.environ.get(key, '') for key in keys]
          if any(values) and not all(values):
              raise SystemExit('请完整配置四个 ANDROID 签名 Secrets，或全部留空使用开发签名。')
          mode = 'development'
          if all(values):
              keystore = Path(os.environ['RUNNER_TEMP']) / 'fooddiary-release.jks'
              keystore.write_bytes(base64.b64decode(values[0], validate=True))
              keystore.chmod(0o600)
              def escape(value):
                  return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
              props = {'storeFile': str(keystore), 'storePassword': values[1], 'keyAlias': values[2], 'keyPassword': values[3]}
              config = Path('frontend/android/key.properties')
              config.write_text(''.join(f'{key}={escape(value)}\n' for key, value in props.items()), encoding='utf-8')
              config.chmod(0o600)
              mode = 'release'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mode={mode}\n')
          PY

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build APK
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ARGS=(--release --build-number="$GITHUB_RUN_NUMBER")
          if [[ -n "$API_BASE_URL" ]]; then
            [[ "$API_BASE_URL" == https://* ]] || { echo '发布包默认服务地址必须使用 HTTPS'; exit 1; }
            BUILD_ARGS+=(--dart-define="API_BASE_URL=$API_BASE_URL")
          fi
          flutter build apk "${BUILD_ARGS[@]}"

      - name: Prepare release files
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APK_NAME="fooddiary-$RELEASE_TAG-android.apk"
          cp frontend/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$APK_NAME"
          cd release-artifacts
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          if [[ "$SIGNING_MODE" == release ]]; then
            printf '%s\n' 'Android APK 使用仓库配置的正式密钥签名。' > release-notes.md
          else
            printf '%s\n' 'Android APK 使用开发签名，适合安装预览。正式签名可通过仓库 ANDROID_* Secrets 配置。' > release-notes.md
          fi
          printf '\n%s\n' '可在登录页「设置服务地址」连接你的 HTTPS 后端。SHA-256 校验文件随 APK 一并提供。' >> release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fooddiary-${{ env.RELEASE_TAG }}-android
          path: |
            release-artifacts/*.apk
            release-artifacts/*.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-artifacts/release-notes.md
          append_body: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f frontend/android/key.properties "$RUNNER_TEMP/fooddiary-release.jks"
